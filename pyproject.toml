[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "thingking-machine"
version = "0.1.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "A machine that thingks."
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]
keywords = ["thingking-machine"]
dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
thingking-machine = "thingking_machine.cli:run"
thingk = "thingking_machine.cli:run"

[project.urls]
"Homepage" = "https://github.com/thingking-machine/thingking-machine"

[dependency-groups]
dev = ["pytest>=8.0.0"]